worker_processes 1;

pid $SNAP_DATA/nginx/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log $SNAP_DATA/nginx/access.log;
    error_log  $SNAP_DATA/nginx/error.log;

    server {
        listen __BIND__:__PORT__;

        server_name _;

        root $SNAP/www;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}