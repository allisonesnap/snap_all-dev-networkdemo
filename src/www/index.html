<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>all360 — Hello World</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
            color: #111111;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "SF Pro Text",
                Inter,
                system-ui,
                sans-serif;
        }

        .container {
            text-align: center;
        }

        .logo {
            font-size: 64px;
            font-weight: 700;
            line-height: 1;

            letter-spacing: -3px;
        }

        .logo-all {
            color: #111111;
        }

        .logo-360 {
            color: #666666;
        }

        .title {
            margin-top: 24px;

            font-size: 28px;
            font-weight: 500;

            letter-spacing: -0.8px;

            color: #222222;
        }

        @media (max-width: 600px) {
            .logo {
                font-size: 48px;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo" aria-label="all360">
            <span class="logo-all">all</span><span class="logo-360">360</span>
        </div>

        <div class="title">
            Hello World
        </div>

    </main>

</body>
</html>
